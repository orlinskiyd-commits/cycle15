<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#03020a">
<title>LMS Gym · C-137</title>
<!-- Шрифты грузятся асинхронно, не блокируя рендер -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@400;700;900&family=Share+Tech+Mono&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@400;700;900&family=Share+Tech+Mono&display=swap"></noscript>
<style>
/* ════════════════════════════════════════════════
   PORTAL LABS · DESIGN SYSTEM
   Rick & Morty Fitness OS · Dimension C-137
════════════════════════════════════════════════ */
:root {
  --void:   #03020a;
  --s1:     #08061a;
  --s2:     #0e0b24;
  --s3:     #16122e;
  --s4:     #1e1a3a;
  --bd:     #26204a;
  --bd2:    #3a2f65;

  --portal: #39ff14;
  --p30:    rgba(57,255,20,.30);
  --p15:    rgba(57,255,20,.15);
  --p08:    rgba(57,255,20,.08);

  --rick:   #00d9ff;
  --r20:    rgba(0,217,255,.20);
  --r08:    rgba(0,217,255,.08);

  --morty:  #f5c518;
  --m20:    rgba(245,197,24,.20);
  --m08:    rgba(245,197,24,.08);

  --purple: #a855f7;

  --heavy-c: #ff6060;
  --heavy-bg: rgba(255,96,96,.12);
  --med-c:   #f5c518;
  --med-bg:  rgba(245,197,24,.12);
  --lite-c:  #69f0ae;
  --lite-bg: rgba(105,240,174,.12);

  --t1: #ede8ff;
  --t2: #9b90c0;
  --t3: #584f78;
  --t4: #2e2850;
  --red: #ff4757;

  --font-d: 'Russo One', system-ui, -apple-system, sans-serif;
  --font-b: 'Exo 2', system-ui, -apple-system, sans-serif;
  --font-m: 'Share Tech Mono', ui-monospace, 'Courier New', monospace;

  --r4:  4px;
  --r8:  8px;
  --r12: 12px;
  --r16: 16px;
  --r20: 20px;
  --r99: 100px;
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent }

html, body {
  background: var(--void);
  color: var(--t1);
  font-family: var(--font-b);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Космический фон */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 10%, rgba(57,255,20,.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 85%, rgba(0,217,255,.05) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(168,85,247,.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

#app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 80px;
  position: relative;
  z-index: 1;
}

button { font-family: var(--font-b); cursor: pointer; }

/* ── ТИПОГРАФИЯ ─────────────────────────────────── */
.d1 { font-family:var(--font-d); font-size:2rem; line-height:1; }
.d2 { font-family:var(--font-d); font-size:1.4rem; line-height:1.1; }
.d3 { font-family:var(--font-d); font-size:1.1rem; line-height:1.2; }
.label {
  font-size:.55rem; font-weight:700;
  letter-spacing:.2em; text-transform:uppercase;
  color: var(--t3);
}
.mono { font-family:var(--font-m); }

/* ── КАРТОЧКИ ───────────────────────────────────── */
.card {
  background: var(--s2);
  border: 1px solid var(--bd);
  border-radius: var(--r20);
  overflow: hidden;
}
.card-glow-g { border-color:var(--p30); box-shadow:0 0 24px var(--p08), inset 0 1px 0 var(--p15); }
.card-glow-b { border-color:var(--r20); box-shadow:0 0 24px var(--r08), inset 0 1px 0 var(--r20); }
.card-glow-y { border-color:var(--m20); box-shadow:0 0 24px var(--m08), inset 0 1px 0 var(--m20); }

/* ── КНОПКИ ─────────────────────────────────────── */
.btn-primary {
  width:100%; padding:16px 24px;
  border:none; border-radius: var(--r16);
  font-family:var(--font-d); font-size:.95rem;
  color:#000; text-transform:uppercase; letter-spacing:.06em;
  cursor:pointer; position:relative; overflow:hidden;
  transition: transform .12s, box-shadow .12s;
}
.btn-primary:active { transform:scale(.97); }
.btn-primary.green  { background:var(--portal); box-shadow:0 4px 24px var(--p30); }
.btn-primary.blue   { background:var(--rick);   box-shadow:0 4px 24px var(--r20); color:#000; }

.btn-ghost {
  padding:8px 16px;
  border:1px solid var(--bd2);
  border-radius:var(--r8);
  background:var(--s3);
  color:var(--t2);
  font-size:.72rem; font-weight:700;
}
.btn-ghost:active { background:var(--s4); }

/* ── НАВИГАЦИЯ ──────────────────────────────────── */
#nav {
  position:fixed; bottom:0;
  left:50%; transform:translateX(-50%);
  width:100%; max-width:430px;
  background: rgba(8,6,26,.92);
  backdrop-filter: blur(20px) saturate(1.5);
  border-top:1px solid var(--bd);
  display:flex; z-index:100;
}
.nb {
  flex:1; padding:12px 0 14px;
  background:none; border:none;
  display:flex; flex-direction:column;
  align-items:center; gap:4px;
  color:var(--t3);
  transition: color .15s;
}
.nb.active { color:var(--portal); }
.nb-icon { font-size:1.2rem; }
.nb-label { font-size:.5rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }

/* ── ПОРТАЛ ─────────────────────────────────────── */
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes portal-pulse { 0%,100%{opacity:.8}50%{opacity:1} }
/* ── Силуэт Рика — фоновый декор ────────────── */
.rick-silhouette {
  position:fixed; bottom:80px; right:-8px;
  pointer-events:none; z-index:0;
  opacity:.05; filter:drop-shadow(0 0 12px var(--portal));
  animation:float 6s ease-in-out infinite;
}

/* ── Терминальные данные — scan-line ──────────── */
@keyframes scanline {
  0%   { background-position:0 0; }
  100% { background-position:0 100px; }
}
.terminal-card {
  background:var(--s2);
  border:1px solid var(--portal);
  border-radius:var(--r12);
  position:relative; overflow:hidden;
}
.terminal-card::after {
  content:'';
  position:absolute; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(57,255,20,.015) 2px,rgba(57,255,20,.015) 4px);
  pointer-events:none;
  animation:scanline 8s linear infinite;
}

/* ── Рик говорит / Морти говорит ─────────────── */
.speech-rick {
  border-left:3px solid var(--portal);
  background:var(--p08); color:var(--portal);
  padding:8px 12px; border-radius:0 var(--r8) var(--r8) 0;
  font-size:.68rem; font-style:italic; line-height:1.5;
}
.speech-rick::before { content:'Рик: '; font-style:normal; font-weight:700; }

.speech-morty {
  border-left:3px solid var(--morty);
  background:var(--m08); color:var(--morty);
  padding:8px 12px; border-radius:0 var(--r8) var(--r8) 0;
  font-size:.68rem; font-style:italic; line-height:1.5;
}
.speech-morty::before { content:'Морти: '; font-style:normal; font-weight:700; }

/* ── Улучшенный Evil Morty ───────────────────── */
.evil-morty-banner {
  background:linear-gradient(135deg,rgba(255,71,87,.18),rgba(168,85,247,.15));
  border:1px solid rgba(255,71,87,.5);
  border-radius:var(--r12); padding:12px 16px;
  margin-bottom:10px;
  box-shadow:0 0 20px rgba(255,71,87,.15);
}

/* ── Портал-пульс на числах ─────────────────── */
.num-glow {
  text-shadow:0 0 12px currentColor;
  animation:glow-pulse 2s ease-in-out infinite;
}

/* ── Звёздное небо ───────────────────────────── */
@keyframes twinkle {
  0%,100% { opacity:.15; transform:scale(1); }
  50%      { opacity:.7;  transform:scale(1.4); }
}
/* ── Портальные украшения ───────────────────── */
.portal-decor {
  position:absolute; border-radius:50%;
  background:conic-gradient(from 0deg,#39ff14,#00d9ff,#a855f7,#39ff14);
  opacity:.12; pointer-events:none;
  animation:spin 6s linear infinite;
}
/* ── Pickle Rick режим ───────────────────────── */
.pickle-mode {
  background:linear-gradient(135deg,rgba(57,255,20,.12),rgba(0,217,255,.08));
  border-color:var(--p30) !important;
}
.pickle-mode::before {
  content:'🥒 PICKLE RICK MODE';
  display:block; padding:6px 16px;
  font-size:.52rem; font-weight:700; letter-spacing:.2em;
  color:var(--portal); background:var(--p08);
  border-bottom:1px solid var(--p15);
  text-align:center;
}
/* ── R&M Отсылки ─────────────────────────────── */
@keyframes glitch {
  0%,92%,100% { text-shadow:none; transform:none; }
  93% { text-shadow:2px 0 var(--rick),-2px 0 var(--red); transform:skewX(-2deg); }
  96% { text-shadow:-2px 0 var(--portal),2px 0 var(--purple); transform:skewX(1deg); }
  98% { text-shadow:none; transform:none; }
}
.glitch { animation:glitch 6s ease-in-out infinite; }

@keyframes float {
  0%,100% { transform:translateY(0); }
  50%      { transform:translateY(-5px); }
}
.float { animation:float 3s ease-in-out infinite; }

.rick-quote {
  background:var(--r08);
  border-left:3px solid var(--rick);
  border-radius:0 var(--r12) var(--r12) 0;
  padding:10px 14px;
  font-size:.7rem; font-style:italic;
  color:var(--rick); line-height:1.6;
}
.morty-note {
  background:var(--m08);
  border-left:3px solid var(--morty);
  border-radius:0 var(--r12) var(--r12) 0;
  padding:8px 12px;
  font-size:.65rem; color:var(--morty); line-height:1.5;
}
.badge-pickle  { background:rgba(57,255,20,.15); color:var(--portal); border-color:var(--p30); }
.badge-portal  { background:var(--r08); color:var(--rick);   border-color:var(--r20); }
.badge-jerry   { background:rgba(90,79,122,.3); color:var(--t2);    border-color:var(--bd2); }


/* ── СПЛЭШ ───────────────────────────────────────────── */






@keyframes scan {
  0%  { transform:translateY(-100%); opacity:.6; }
  100%{ transform:translateY(100vh);  opacity:0; }
}


/* ── Фоновый портал ──────────────────────────────────── */
#portal-bg {
  position:fixed; right:-80px; top:20%; z-index:0;
  width:260px; height:260px; border-radius:50%;
  background:conic-gradient(from 0deg,rgba(57,255,20,.07),rgba(0,217,255,.05),rgba(168,85,247,.06),rgba(57,255,20,.07));
  animation:spin 20s linear infinite;
  pointer-events:none;
  filter:blur(1px);
}
#portal-bg::after {
  content:''; position:absolute; inset:20px; border-radius:50%;
  background:radial-gradient(circle,rgba(57,255,20,.04) 0%,transparent 70%);
}
/* ── Сканлайны на sticky-header ──────────────────────── */
.sticky-hdr::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(57,255,20,.015) 2px,rgba(57,255,20,.015) 4px);
}
/* ── Анимированный портальный фон ────────────── */
@keyframes portal-bg-spin {
  from { transform:translate(-50%,-50%) rotate(0deg); }
  to   { transform:translate(-50%,-50%) rotate(360deg); }
}
.portal-bg-decor {
  position:fixed; width:600px; height:600px; border-radius:50%;
  top:40%; left:50%;
  background:conic-gradient(from 0deg,rgba(57,255,20,.03),rgba(0,217,255,.02),rgba(168,85,247,.03),transparent,rgba(57,255,20,.03));
  animation:portal-bg-spin 30s linear infinite;
  pointer-events:none; z-index:0;
  filter:blur(40px);
  will-change:transform;
}

/* ── Попап завершения упражнения ─────────────── */
@keyframes popup-in  { from{opacity:0;transform:translateY(20px) scale(.9)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes popup-out { from{opacity:1;transform:scale(1)} to{opacity:0;transform:scale(.8)} }
.ex-popup {
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
  background:var(--s3); border:1px solid var(--p30);
  border-radius:var(--r99); padding:10px 20px;
  font-size:.78rem; font-weight:700; color:var(--portal);
  box-shadow:0 4px 24px var(--p15);
  animation:popup-in .3s ease both;
  z-index:200; white-space:nowrap;
  max-width:90vw; text-align:center;
}

/* ── Evil Morty режим (сессия 24) ────────────── */
.evil-morty-banner {
  background:linear-gradient(135deg,rgba(255,71,87,.15),rgba(168,85,247,.1));
  border:1px solid rgba(255,71,87,.4);
  border-radius:var(--r12); padding:10px 14px;
  margin-bottom:10px; text-align:center;
}

/* ── Портальная пушка SVG ────────────────────── */
.portal-gun { filter:drop-shadow(0 0 6px rgba(57,255,20,.5)); }

/* ── Реакция персонажа (мысль-пузырь) ────────── */
.char-bubble {
  background:var(--s3); border:1px solid var(--bd);
  border-radius:var(--r12) var(--r12) var(--r12) 4px;
  padding:8px 12px; font-size:.68rem; color:var(--t2);
  font-style:italic; line-height:1.5; position:relative;
}
.char-bubble::before {
  content:''; position:absolute; bottom:-8px; left:16px;
  border:4px solid transparent;
  border-top-color:var(--bd);
}

.portal-ring {
  width:60px; height:60px; border-radius:50%; flex-shrink:0;
  background:transparent;
  animation:spin 12s linear infinite;
  display:flex; align-items:center; justify-content:center;
  will-change:transform;
  overflow:hidden;
}
.portal-ring img, .portal-img {
  width:100%; height:100%;
  border-radius:50%;
  mix-blend-mode:screen;
  object-fit:cover;
}
.portal-inner {
  width:44px; height:44px; border-radius:50%;
  background:var(--void);
  display:flex; align-items:center; justify-content:center;
  font-size:1.4rem;
}

/* ── ПРОГРЕСС-БАР ───────────────────────────────── */
.pbar { height:3px; background:var(--s4); border-radius:99px; overflow:hidden; }
.pbar-fill { height:100%; border-radius:99px; transition:width .4s ease; }

/* ── БЕЙДЖИ НАГРУЗКИ ────────────────────────────── */
.badge {
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 10px;
  border-radius:var(--r99);
  font-size:.58rem; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
  border:1px solid transparent;
}
.badge-heavy  { background:var(--heavy-bg); color:var(--heavy-c); border-color:rgba(255,96,96,.3); }
.badge-medium { background:var(--med-bg);   color:var(--med-c);   border-color:rgba(245,197,24,.3); }
.badge-light  { background:var(--lite-bg);  color:var(--lite-c);  border-color:rgba(105,240,174,.3); }

/* ── ИНПУТЫ ─────────────────────────────────────── */
.inp {
  width:100%; padding:12px 16px;
  background:var(--s3); border:1px solid var(--bd);
  border-radius:var(--r12); color:var(--t1);
  font-size:.9rem; font-family:var(--font-b);
  outline:none; transition:border-color .15s, box-shadow .15s;
}
.inp:focus { border-color:var(--p30); box-shadow:0 0 0 3px var(--p08); }
.inp[type=date]::-webkit-calendar-picker-indicator { filter:invert(.5); }

/* ── ДЕНЬ КНОПКИ ────────────────────────────────── */
.day-btn {
  padding:10px 0;
  border:1.5px solid var(--bd); border-radius:var(--r8);
  background:var(--s3); color:var(--t3);
  font-weight:700; font-size:.68rem;
  transition:all .15s;
}
.day-btn.sel {
  border-color:var(--portal); background:var(--p08);
  color:var(--portal);
}

/* ── ЭКРАНЫ ─────────────────────────────────────── */
.screen { padding:20px 16px; }

/* ── ТРЕНИРОВКА ─────────────────────────────────── */
.sticky-hdr {
  position:sticky; top:0; z-index:20;
  background:rgba(8,6,26,.95);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bd);
  padding:14px 16px 12px;
}

/* ── УПРАЖНЕНИЕ-КАРТА ───────────────────────────── */
.ex-card {
  background:var(--s2);
  border:1px solid var(--bd);
  border-radius:var(--r20);
  overflow:hidden;
  margin-bottom:8px;
  transition:border-color .2s;
}
.ex-card.expanded { border-color:var(--bd2); }
.ex-hdr-btn {
  width:100%; background:none; border:none;
  padding:14px 16px;
  display:flex; align-items:center; gap:12px;
  text-align:left;
}

/* Номер упражнения */
.ex-num {
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:.72rem; font-weight:700;
  border:2px solid var(--bd);
  background:var(--s3); color:var(--t3);
  transition:all .2s;
}
.ex-num.active { border-color:var(--portal); color:var(--portal); background:var(--p08); }
.ex-num.done   { border-color:var(--portal); color:var(--portal); background:var(--p15);
                  box-shadow:0 0 8px var(--p15); }

/* ── КЛАСТЕРЫ ───────────────────────────────────── */
.cluster-wrap { padding:0 16px 14px; }
.cluster {
  background:var(--s3); border:1px solid var(--bd);
  border-radius:var(--r16); padding:14px;
  margin-bottom:8px;
}
.cluster.done { background:rgba(57,255,20,.05); border-color:var(--p30); }
.cluster-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; }

/* Кнопки подходов */
.sets-row { display:flex; gap:8px; flex-wrap:wrap; }
.set-btn {
  width:42px; height:42px; border-radius:12px;
  border:2px solid var(--bd);
  background:var(--s4); color:var(--t3);
  font-weight:700; font-size:.8rem;
  transition:all .15s;
  display:flex; align-items:center; justify-content:center;
}
.set-btn.done {
  background:var(--p15); border-color:var(--portal);
  color:var(--portal); box-shadow:0 0 10px var(--p15);
}
.set-btn:active { transform:scale(.92); }

/* ── МЕТРИКИ ────────────────────────────────────── */
.metrics-row {
  display:flex; gap:8px;
  padding:10px 14px 4px;
  border-top:1px solid var(--bd);
}
.metric-chip {
  flex:1; background:var(--s3); border-radius:var(--r8);
  padding:8px 10px; text-align:center;
  border:1px solid var(--bd);
}
.metric-val { font-family:var(--font-m); font-size:.9rem; font-weight:700; }
.metric-lbl { font-size:.48rem; color:var(--t3); text-transform:uppercase; letter-spacing:.14em; margin-top:2px; }

/* ── GRID МЕТРИК ────────────────────────────────── */
.metrics-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.metric-cell {
  background:var(--s3); border:1px solid var(--bd);
  border-radius:var(--r12); padding:12px 14px;
}
.metric-cell-val { font-family:var(--font-m); font-size:1.2rem; font-weight:700; }
.metric-cell-lbl { font-size:.52rem; color:var(--t3); text-transform:uppercase; letter-spacing:.14em; margin-top:3px; }

/* ── РАСПИСАНИЕ ─────────────────────────────────── */
.sched-item {
  display:flex; align-items:center; gap:12px;
  padding:10px 16px;
  border-top:1px solid var(--bd);
}
.sched-dot {
  width:8px; height:8px; border-radius:50%;
  flex-shrink:0;
}

/* ── РАСКЛАДКА ИТОГОВ ───────────────────────────── */
.sum-screen {
  min-height:100vh;
  padding:32px 16px 100px;
}
.sum-hero {
  text-align:center;
  padding:32px 16px 24px;
}

/* ── ИСТОРИЯ ────────────────────────────────────── */
.hist-item {
  background:var(--s2); border:1px solid var(--bd);
  border-radius:var(--r16); overflow:hidden;
  margin-bottom:8px; position:relative;
}
.hist-accent {
  position:absolute; left:0; top:0; bottom:0; width:3px;
}
.hist-hdr-btn {
  width:100%; background:none; border:none;
  padding:12px 16px 12px 20px;
  display:flex; align-items:center;
  font-family:var(--font-b); text-align:left;
}
.hist-body { border-top:1px solid var(--bd); padding:10px 16px; }

/* ── ЗАГЛУШКИ ───────────────────────────────────── */

// ── ПМ-ФОРМУЛЫ ───────────────────────────────────────────
// Рост ПМ: ПМ_нов = ПМ_баз × (1 + корр/100)^неделя
// 0.5% в неделю — рекомендация из файла для натуральных
function growPM(base, weeks, corr) { return base * Math.pow(1 + corr/100, weeks); }

function getExPM(exId, bench, squat) {
  const e = EX[exId];
  if (!e) return 0;
  const base = e.pmOf === 'squat' ? squat : bench;
  return base * e.ratio;
}

function roundW(w, step) { step = step || 2.5; return Math.round(w / step) * step; }

// ── МЕТРИКИ LMS (из файла) ────────────────────────────────
// Тоннаж = Σ(вес × повт × подходы)
// КПШ    = Σ(повт × подходы)
// Ср.вес = Тоннаж / КПШ
// ОИ     = Ср.вес / ПМ
function exMetrics(clusters, pm) {
  let T=0, K=0;
  clusters.forEach(c=>{T+=c.weight*c.reps*c.doneSets; K+=c.reps*c.doneSets;});
  const avg=K>0?T/K:0;
  return{tonnage:T, kpsh:K, avg, oi:pm>0&&K>0?avg/pm:0};
}
function totalMetrics(exercises) {
  let T=0,K=0;
  exercises.forEach(ex=>{const m=exMetrics(ex.clusters,ex.pm);T+=m.tonnage;K+=m.kpsh;});
  return{tonnage:T, kpsh:K, avg:K>0?T/K:0};
}

// ── ПОСТРОЕНИЕ ТРЕНИРОВКИ ────────────────────────────────
function buildSession(sessionN, bench, squat) {
  const sess = SESSIONS[sessionN % 24];
  return {
    ...sess,
    exercises: sess.exercises.map(exDef => {
      const pm = getExPM(exDef.id, bench, squat);
      return {
        id: exDef.id,
        load: exDef.load,
        pm,
        clusters: exDef.cl.map(c => ({
          p: c.p,
          weight: roundW(pm * c.p, EX[exDef.id] && EX[exDef.id].step),
          reps: c.r,
          numSets: c.n,
          doneSets: 0,
        })),
      };
    }),
  };
}

function sessionDate(n) {
  const days = (S.trainingDays||[]).slice().sort((a,b)=>a-b);
  if(!S.startDate||!days.length) return null;
  let d=new Date(S.startDate); d.setHours(0,0,0,0);
  let cnt=-1;
  if(days.includes(d.getDay())){cnt=0;if(cnt===n)return new Date(d);}
  for(let i=0;i<3650;i++){
    d=new Date(d.getTime()+86400000);
    if(days.includes(d.getDay())){cnt++;if(cnt===n)return new Date(d);}
  }
  return null;
}
function todayStr(){return new Date().toISOString().slice(0,10);}
function todayDate(){const d=new Date();d.setHours(0,0,0,0);return d;}
function fmtDate(d){if(!d)return'—';const dd=d instanceof Date?d:new Date(d);return`${DAY_NAMES[dd.getDay()]} ${dd.getDate()} ${MONTH_SHORT[dd.getMonth()]}`;}
function fmtFull(d){if(!d)return'—';const dd=d instanceof Date?d:new Date(d);return`${DAY_NAMES[dd.getDay()]}, ${dd.getDate()} ${MONTH_SHORT[dd.getMonth()]} ${dd.getFullYear()}`;}
function timeStr(s){return Math.floor(s/60)+':'+(s%60+'').padStart(2,'0');}
function pctStr(v){return(v*100).toFixed(0)+'%';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function shiftSchedule(actualStr) {
  const planned = sessionDate(S.sessionCount-1);
  if(!planned) return;
  const actual = new Date(actualStr); actual.setHours(0,0,0,0);
  const diff = Math.round((actual-planned)/86400000);
  if(!diff) return;
  const ns = new Date(S.startDate); ns.setDate(ns.getDate()+diff);
  S.startDate = ns.toISOString().slice(0,10);
  saveSave();
}

  } else {

function startWorkout(){
  if(!S.benchPM||!S.squatPM){S.screen='setup';render();return;}
  const n=S.sessionCount;
  const week=Math.floor(n/2);
  const bench=growPM(S.benchPM,week,S.corrPct);
  const squat=growPM(S.squatPM,week,S.corrPct);
  const sess=buildSession(n,bench,squat);
  const plannedDate=sessionDate(n);
  S.workout={
    sessionN:n, startTime:Date.now(),
    plannedDate:plannedDate?plannedDate.toISOString().slice(0,10):todayStr(),
    actualDate:todayStr(), expEx:0,
    warmup:sess.warmup,
    exercises:sess.exercises,
  };
  S.screen='workout';render();startTimer();
}

function markSet(ei,ci,add){
  if(!S.workout)return;
  const c=S.workout.exercises[ei].clusters[ci];
  if(add&&c.doneSets<c.numSets)c.doneSets++;
  if(!add&&c.doneSets>0)c.doneSets--;
  const ex=S.workout.exercises[ei];
  if(ex.clusters.every(cl=>cl.doneSets===cl.numSets)){
    showMeeseeksToast();
    if(ei<S.workout.exercises.length-1)
      setTimeout(()=>{if(S.workout){S.workout.expEx=ei+1;render();}},380);
  }
  render();
}
function finishWorkout(){
  stopTimer();
  const elapsed=Math.floor((Date.now()-S.workout.startTime)/1000);
  const total=totalMetrics(S.workout.exercises);
  const dateMatch=S.workout.actualDate===S.workout.plannedDate;
  const rec={
    id:Date.now(),date:S.workout.actualDate,plannedDate:S.workout.plannedDate,
    sessionN:S.workout.sessionN,duration:Math.floor(elapsed/60),
    week:Math.floor(S.workout.sessionN/2),total,
    exercises:S.workout.exercises.map(ex=>{
      return{id:ex.id,pm:ex.pm,load:ex.load,...exMetrics(ex.clusters,ex.pm)};
    }),
  };
  S.summary={rec,needsCorrection:!dateMatch};
  S.sessionCount++;S.history=[rec,...S.history].slice(0,300);
  S.workout=null;saveSave();render();
}

function rickQ() { return RICK_Q[Math.floor(Date.now()/86400000) % RICK_Q.length]; }

// Реплика для типа нагрузки
function loadQuip(l) {
  if(l==='heavy') return 'Огурчик-Рик одобряет 🥒';
  if(l==='medium') return 'Портальный режим 🌀';
  return 'Режим Джерри 😬';
}
// Реплика после завершения подхода
function setQuip(done, total) {
  if(done===total) return '🥒 Огурчик-Рик доволен!';
  if(done===0) return 'Давай, Морти!';
  return `${done}/${total} — не останавливайся!`;
}

function showMeeseeksToast() {
  const msg = MEESEEKS_Q[_mq++ % MEESEEKS_Q.length];
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0e0b24;border:1px solid rgba(57,255,20,.4);border-radius:100px;padding:8px 18px;font-size:.7rem;color:#39ff14;z-index:500;white-space:nowrap;box-shadow:0 0 20px rgba(57,255,20,.2);font-family:Exo 2,sans-serif;font-weight:700;transition:opacity .4s';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(() => t.remove(), 400); }, 2000);
}

// ── УТИЛИТЫ ────────────────────────────────────────
function timeStr(s){return Math.floor(s/60)+':'+(s%60+'').padStart(2,'0');}
function pctStr(v){return(v*100).toFixed(0)+'%';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function loadClass(l){return l==='heavy'?'pickle':l==='medium'?'portal':'jerry';}
function loadLabel(l){return l==='heavy'?'ОГУРЧИК-РИК':l==='medium'?'ПОРТАЛЬНЫЙ':'РЕЖИМ ДЖЕРРИ';}
function loadEmoji(l){return l==='heavy'?'🥒':l==='medium'?'🌀':'😬';}
function loadColor(l){return l==='heavy'?'var(--heavy-c)':l==='medium'?'var(--med-c)':'var(--lite-c)';}

// ── НАСТРОЙКА ──────────────────────────────────────
function setupHTML(){
  const isEdit = S.benchPM > 0;
  let header = '';
  if (isEdit) {
    header = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <button onclick="navTo('home')" class="btn-ghost" style="padding:10px 14px;font-size:.8rem">← Назад</button>
      <div class="d3">Параметры цикла</div>
    </div>`;
  } else {
    header = `<div style="text-align:center;margin-bottom:32px">
      <div class="portal-ring" style="width:80px;height:80px;margin:0 auto 20px"><img class="portal-img" alt="portal"></div>
      <div class="d2" style="color:var(--portal);margin-bottom:6px">LMS Gym</div>
      <div style="font-size:.7rem;color:var(--t3)">Система периодизации · cycle15 · C-137</div>
    </div>`;
  }

  return `<div class="screen fade-up">
    ${header}
    <div style="background:var(--m08);border:1px solid var(--m20);border-radius:var(--r12);padding:12px 16px;margin-bottom:20px;font-size:.72rem;color:var(--morty);line-height:1.6">
      ⚗️ <b>Слушай меня, Морти.</b> Только два числа имеют значение во всей этой вселенной — твой <b>ПМ жима и ПМ приседа</b>. Всё остальное рассчитает наука.
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="section-hdr">
        <div class="label" style="color:var(--portal)">🏋️ Предельные максимумы</div>
      </div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:14px">
        <div>
          <div class="label" style="margin-bottom:8px">Жим лёжа, кг</div>
          <input class="inp" id="si_bench" type="number" min="20" max="400" step="2.5"
            value="${S._draft ? S._draft.bench : (S.benchPM||'')}" placeholder="напр. 100">
          <div style="font-size:.6rem;color:var(--t3);margin-top:6px">Расчёт: вес × (1 + повт ÷ 30). Пример: 50 кг × 5 повт → ≈ 58 кг ПМ</div>
        </div>
        <div>
          <div class="label" style="margin-bottom:8px">Присед, кг</div>
          <input class="inp" id="si_squat" type="number" min="20" max="500" step="2.5"
            value="${S._draft ? S._draft.squat : (S.squatPM||'')}" placeholder="напр. 120">
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="section-hdr">
        <div class="label" style="color:var(--rick)">📅 Дата и дни</div>
      </div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:14px">
        <div>
          <div class="label" style="margin-bottom:8px">Дата начала цикла</div>
          <input class="inp" id="si_date" type="date" value="${S._draft ? S._draft.date : (S.startDate||todayStr())}">
        </div>
        <div>
          <div class="label" style="margin-bottom:8px">Дни тренировок</div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">
            ${DAY_NAMES.map((n,i)=>`<button class="day-btn${S.trainingDays.includes(i)?' sel':''}" onclick="toggleDay(${i})">${n}</button>`).join('')}
          </div>
          <div style="font-size:.62rem;color:var(--t3);margin-top:8px">
            ${S.trainingDays.slice().sort((a,b)=>a-b).map(d=>DAY_NAMES[d]).join(', ')}
          </div>
          <div style="font-size:.58rem;color:${S.trainingDays.length>=2?'var(--portal)':'var(--red)'};margin-top:4px">
            ${S.trainingDays.length>=2?'✅ 2 дня выбрано — оптимально для программы':'⚠️ Выбери ровно 2 дня в неделю'}
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:24px">
      <div class="section-hdr">
        <div class="label" style="color:var(--morty)">📈 Прогрессия ПМ</div>
      </div>
      <div style="padding:16px">
        <div class="label" style="margin-bottom:8px">Рост ПМ в неделю, %</div>
        <input class="inp" id="si_corr" type="number" min="0.1" max="5" step="0.1" value="${S._draft ? S._draft.corr : (S.corrPct||0.5)}">
        <div style="font-size:.6rem;color:var(--t3);margin-top:6px">
          0.5% — рекомендация файла для натуральных атлетов
        </div>
      </div>
    </div>

    <button class="btn-primary green" onclick="saveSetup()">
      ${isEdit ? '💾 Сохранить' : '🚀 Начать цикл'}
    </button>
    ${H(isEdit,'<div style="text-align:center;margin-top:12px"><button onclick="navTo(\'home\')" style="background:none;border:none;color:var(--t3);font-size:.72rem;text-decoration:underline;font-family:var(--font-b)">Отмена</button></div>')}
  </div>`;
}

// ── ГЛАВНАЯ ────────────────────────────────────────
function homeHTML(){
  const n=S.sessionCount;
  const week=Math.floor(n/2);
  const bench=growPM(S.benchPM,week,S.corrPct);
  const squat=growPM(S.squatPM,week,S.corrPct);
  const quoteText = rickQ();
  const isEpCite = quoteText.startsWith('[');
  const topBanner = (!S.benchPM||!S.squatPM)
    ? '<div style="background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.35);border-radius:var(--r12);padding:12px 16px;margin-bottom:14px;font-size:.76rem;color:var(--red)">⚠️ ПМ не заданы — нажми <b>⚙ ПМ</b> и введи жим лёжа и присед</div>'
    : '<div class="speech-rick" style="margin-bottom:14px">' + quoteText + '</div>';
  const sess=SESSIONS[n%24];
  const today=todayDate();
  const plannedNext=sessionDate(n);
  const isToday=plannedNext&&plannedNext.toDateString()===today.toDateString();
  const isPast=plannedNext&&plannedNext<today;

  // Список упражнений
  const exRows = sess.exercises.map((exDef,i)=>{
    const ex=EX[exDef.id];
    const pm=getExPM(exDef.id,bench,squat);
    const main=exDef.cl[exDef.cl.length-1];
    const w=roundW(pm*main.p);
    const lc=loadColor(exDef.load);
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;${i?'border-top:1px solid var(--bd)':''}">
      <div>
        <div style="font-size:.82rem;font-weight:700">${esc(ex.name)}</div>
        <div style="font-size:.58rem;color:var(--t3);margin-top:2px">${esc(ex.hint)}</div>
        ${H(exLore(exDef.id),'<div style="font-size:.52rem;color:var(--t4);margin-top:1px;font-style:italic">'+exLore(exDef.id)+'</div>')}
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge badge-${loadClass(exDef.load)}">${loadEmoji(exDef.load)} ${loadLabel(exDef.load)}</span>
        <div style="text-align:right;min-width:54px">
          <div style="font-family:var(--font-m);font-size:.88rem;font-weight:700;color:${lc}">${w} кг</div>
          <div style="font-size:.52rem;color:var(--t3)">${pctStr(main.p)}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Расписание
  const schedItems=[];
  for(let i=Math.max(0,n-1);i<n+5;i++){
    const d=sessionDate(i);if(!d)break;
    const isNow=i===n,isPst=i<n;
    const todayMatch=d.toDateString()===today.toDateString();
    const dotColor=isPst?'var(--t4)':isNow?'var(--portal)':'var(--bd2)';
    schedItems.push(`<div class="sched-item">
      <div class="sched-dot" style="background:${dotColor};${isNow?'box-shadow:0 0 6px var(--portal)':''}"></div>
      <div style="flex:1">
        <div style="font-size:.76rem;font-weight:${isNow?700:500};color:${isNow?'var(--portal)':isPst?'var(--t3)':'var(--t1)'}">
          ${fmtDate(d)}${todayMatch&&!isPst?' <span style="font-size:.58rem;color:var(--portal)">· сегодня</span>':''}
        </div>
        <div style="font-size:.56rem;color:var(--t3);margin-top:1px">С${i+1} · ${dimension(i)}</div>
      </div>
      ${isPst?'<span style="font-size:.82rem">✅</span>':H(isNow,'<span style="font-size:.7rem;font-weight:700;color:var(--portal)">→</span>')}
    </div>`);
  }

  return `<div style="padding:20px 16px">
    <!-- Шапка -->
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:24px">
      <div class="portal-ring" onclick="onPortalTap()" style="cursor:pointer" title="Нажми 5 раз..."><img src="${PORTAL_IMG}" alt="portal"></div>
      <div>
        <div class="label" style="margin-bottom:4px">LMS · cycle15 · Сессия ${n+1}/24</div>
        <div class="d2 glitch" style="line-height:1.2">Пора качаться,<br><span style="color:var(--portal)">Морти!</span></div>
        <div style="font-size:.62rem;color:var(--t3);margin-top:4px">Неделя ${week+1} · ${S.history.length} выполнено</div>

// ── ТРЕНИРОВКА ─────────────────────────────────────
function workoutHTML(){
  const W=S.workout;
  const tSets=W.exercises.reduce((a,ex)=>a+ex.clusters.reduce((b,c)=>b+c.numSets,0),0);
  const dSets=W.exercises.reduce((a,ex)=>a+ex.clusters.reduce((b,c)=>b+c.doneSets,0),0);
  const allDone=dSets===tSets;
  const elapsed=Math.floor((Date.now()-W.startTime)/1000);
  const totals=totalMetrics(W.exercises);
  const pct=tSets?Math.round(dSets/tSets*100):0;
  const dateOk=W.actualDate===W.plannedDate;

  let exCards='';
  W.exercises.forEach((ex,ei)=>{
    const meta=EX[ex.id];
    const doneEx=ex.clusters.reduce((a,c)=>a+c.doneSets,0);
    const totalEx=ex.clusters.reduce((a,c)=>a+c.numSets,0);
    const exDone=doneEx===totalEx;
    const exp=W.expEx===ei;
    const lc=loadColor(ex.load);

    let numStyle='';
    if(exDone) numStyle='done';
    else if(doneEx>0) numStyle='active';

    let body='';
    if(exp){
      let clusters='';
      ex.clusters.forEach((c,ci)=>{
        const clDone=c.doneSets===c.numSets;
        let sets='';
        for(let si=0;si<c.numSets;si++){
          const done=si<c.doneSets;
          sets+=`<button class="set-btn${done?' done':''}" onclick="markSet(${ei},${ci},${done?0:1})">${done?'✓':(si+1)}</button>`;
        }
        const mtr=exMetrics(ex.clusters,ex.pm);
        clusters+=`<div class="cluster${clDone?' done':''}">
          <div class="cluster-top">
            <div>
              <div style="font-family:var(--font-m);font-size:.6rem;color:${clDone?'var(--portal)':lc};font-weight:700;letter-spacing:.08em">${pctStr(c.p)} от ПМ</div>
              <div style="font-family:var(--font-d);font-size:1.4rem;color:${clDone?'var(--portal)':lc};margin-top:1px">${c.weight} кг</div>
              <!-- Повторения крупно -->
              <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
                <div style="background:${clDone?'var(--p15)':'var(--s4)'};border:1.5px solid ${clDone?'var(--portal)':'var(--bd2)'};border-radius:8px;padding:4px 10px;display:flex;align-items:center;gap:5px">
                  <span style="font-family:var(--font-d);font-size:1.1rem;color:${clDone?'var(--portal)':lc}">${c.reps}</span>
                  <span style="font-size:.58rem;color:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:.1em">повт</span>
                </div>
                <div style="font-size:.6rem;color:var(--t3)">${c.doneSets}/${c.numSets} подх</div>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-size:.58rem;color:var(--t3)">ПМ</div>
              <div class="mono" style="font-size:.8rem;color:var(--t2)">${ex.pm.toFixed(0)} кг</div>
            </div>
          </div>
          <div class="sets-row">${sets}</div>
        </div>`;
      });

      const mtr=exMetrics(ex.clusters,ex.pm);
      const mtrRow=mtr.kpsh>0?`<div class="metrics-row">
        <div class="metric-chip"><div class="metric-val" style="color:${lc}">${mtr.tonnage.toFixed(0)}</div><div class="metric-lbl">Тоннаж кг</div></div>
        <div class="metric-chip"><div class="metric-val" style="color:${lc}">${mtr.kpsh}</div><div class="metric-lbl">КПШ</div></div>
        <div class="metric-chip"><div class="metric-val" style="color:${lc}">${pctStr(mtr.oi)}</div><div class="metric-lbl">ОИ</div></div>
      </div>`:'';

      body=`<div class="cluster-wrap">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <span class="badge badge-${loadClass(ex.load)}">${loadEmoji(ex.load)} ${loadLabel(ex.load)}</span>
          <span style="font-size:.6rem;color:var(--t3)">к${meta.koef} · ${esc(meta.hint)}</span>
          ${H(exLore(ex.id),'<div style="font-size:.54rem;color:var(--t4);margin-top:4px;font-style:italic">'+exLore(ex.id)+'</div>')}
        </div>
        ${clusters}
        ${mtrRow}
        <div style="margin-top:8px;padding:8px 12px;background:var(--s3);border-radius:var(--r8);font-size:.62rem;color:var(--t3);border:1px solid var(--bd)">
          ${meta.koef>=1.0?'⏸ 2–3 мин — [S02E04] «Иногда наука — это просто ждать, Морти»':meta.koef>=0.5?'⏸ 90 сек — [S01E05] Мисекс бы не отдыхал. Но ты не Мисекс.':'⏸ 60 сек — [S01E09] «Ты передаёшь масло». Отдыхай.'}
        </div>
      </div>`;
    }

    exCards+=`<div class="ex-card${exp?' expanded':''}">
      <button class="ex-hdr-btn" onclick="toggleEx(${ei})">
        <div class="ex-num ${numStyle}">${exDone?'✓':ei+1}</div>
        <div style="flex:1">
          <div style="font-size:.84rem;font-weight:700">${esc(meta.name)}</div>
          <div style="font-size:.6rem;color:var(--t3);margin-top:2px">${esc(meta.hint)}</div>
        </div>
        <div style="text-align:right">
          <div class="mono" style="font-size:.8rem;font-weight:700;color:${lc}">${ex.pm.toFixed(0)} кг</div>
          <div style="font-size:.54rem;color:var(--t3);margin-top:2px">${doneEx}/${totalEx} подх</div>
        </div>
      </button>
      ${body}
    </div>`;
  });

  const fin=allDone?`<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:16px;background:rgba(8,6,26,.96);backdrop-filter:blur(20px);border-top:1px solid var(--p30)">
    <button class="btn-primary green" onclick="finishWorkout()" style="animation:glow-pulse 1.5s ease-in-out infinite">🥒 ОГУРЧИК-РИК ДОВОЛЕН! Завершить!</button>
  </div>`:'';

  return `<div style="min-height:100vh;background:var(--void)">
    <!-- Шапка тренировки -->
    <div class="sticky-hdr">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div>
          <div class="label" style="margin-bottom:3px">📅 ${fmtFull(new Date())}</div>
          <div class="d3">Сессия ${W.sessionN+1}/24 · <span style="color:var(--portal)">${W.sessionN===23 ? String.fromCodePoint(9760)+' EVIL MORTY' : dimension(W.sessionN)}</span></div>
          ${H(!dateOk,'<div style="font-size:.58rem;color:var(--red);margin-top:2px">⚠️ По плану: '+fmtDate(new Date(W.plannedDate))+'</div>')}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span id="tmr" class="mono" style="font-size:.82rem;color:var(--t2)">${timeStr(elapsed)}</span>
          <button class="btn-ghost" onclick="cancelWorkout()">Отмена</button>
        </div>
      </div>
      <!-- Разминка -->
      <div style="background:var(--s3);border-radius:var(--r8);padding:8px 12px;margin-bottom:10px;border:1px solid var(--bd)">
        <span class="label" style="margin-right:6px">🏃 Разминка</span>
        <span style="font-size:.65rem;color:var(--t2)">${esc(W.warmup)}</span>
      </div>
      <!-- Прогресс -->
      <div class="pbar" style="margin-bottom:6px">
        <div class="pbar-fill" style="width:${pct}%;background:var(--portal);box-shadow:0 0 8px var(--p30)"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:.6rem;color:var(--t3);margin-bottom:10px">
        <span>Подходов: <b style="color:var(--t1)">${dSets}/${tSets}</b> ${allDone?'<span style="color:var(--portal)">✓ Готово!</span>':''}</span>
        ${H(totals.kpsh>0,'<span class="mono">Тоннаж <b style="color:var(--portal)">'+totals.tonnage.toFixed(0)+' кг</b> · КПШ <b style="color:var(--portal)">'+totals.kpsh+'</b></span>')}
      </div>
    </div>
    <!-- Упражнения -->
    <div style="padding:12px 16px ${allDone?'120':'16'}px">
    ${isEvilMorty(W.sessionN)?'<div class="evil-morty-banner"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="none" stroke="#ff4757" stroke-width="1.5"/><circle cx="12" cy="12" r="6" fill="rgba(255,71,87,.15)"/><ellipse cx="7" cy="10" rx="3" ry="3.5" fill="white"/><circle cx="7" cy="10" r="2" fill="#1a1a2e"/><line x1="4" y1="8" x2="10" y2="12" stroke="#ff4757" stroke-width="1.5"/><circle cx="17" cy="10" rx="3" ry="3.5" fill="white"/><circle cx="17" cy="10" r="2" fill="#1a1a2e"/><path d="M10 15 Q12 17 14 15" fill="none" stroke="#ff4757" stroke-width="1"/></svg><span style="font-size:.62rem;font-weight:700;color:var(--red);letter-spacing:.14em;text-transform:uppercase">👁 ФИНАЛ · СЕССИЯ 24 · EVIL MORTY</span></div><div style="font-size:.62rem;color:var(--t2);font-style:italic">«Я всегда был умнейшим Морти из всех измерений.»<br><span style="color:var(--red);font-style:normal">Последняя сессия цикла. Докажи это.</span></div></div>':''}
    ${isPickleMode(W.sessionN)&&!isEvilMorty(W.sessionN)?'<div class="card pickle-mode" style="margin-bottom:10px;overflow:hidden"><div style="padding:10px 14px;font-size:.65rem;color:var(--portal)">🥒 PICKLE RICK MODE — Рик гордится. Морти испуган.</div></div>':''}
    ${exCards}
  </div>
    ${fin}
  </div>`;
}

      <div style="flex:1">
        <div style="font-size:.78rem;font-weight:700">${esc(meta.name)}</div>
        <div style="font-size:.56rem;color:var(--t3);margin-top:1px">к${meta.koef} · ${meta.pmOf==='squat'?'присед':'жим'} × ${meta.ratio}</div>
      </div>
      <div class="mono" style="font-size:.9rem;font-weight:700;color:var(--portal)">${pm.toFixed(1)} кг</div>
    </div>`;
  }).join('');

  const forecast=[0,4,8,12,15].map(w=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.7rem;align-items:center">
    <span style="color:var(--t3)">Нед ${w+1}</span>
    <span>Жим <b class="mono" style="color:var(--portal)">${growPM(S.benchPM,w,S.corrPct).toFixed(1)}</b> · Присед <b class="mono" style="color:var(--rick)">${growPM(S.squatPM,w,S.corrPct).toFixed(1)}</b> кг</span>
  </div>`).join('');

  return`<div class="screen">
    <div class="d3" style="margin-bottom:6px">Прогресс, Морти</div>
    <div style="font-size:.62rem;color:var(--t3);margin-bottom:8px">Неделя ${week+1} · +${S.corrPct}%/нед</div>
    <div class="morty-note" style="margin-bottom:16px">«0.5% в неделю — это не медленно, Морти. Это *наука*. Джерри до сих пор топчется на месте.»</div>

    <div class="card" style="margin-bottom:12px;overflow:hidden">
      <div class="section-hdr">
        <div class="label" style="color:var(--portal)">⚗️ База C-137 · Текущий ПМ</div>
      </div>
      ${exRows}
    </div>

    <div class="card" style="padding:14px 16px;margin-bottom:12px">
      <div class="label" style="color:var(--morty);margin-bottom:12px">📈 Прогноз ПМ</div>
      ${forecast}
    </div>

    <div class="card" style="padding:14px 16px">
      <div class="label" style="margin-bottom:12px">📐 Формулы из cycle15</div>
      ${[['Тоннаж','Σ(вес × повт × подходы)'],['КПШ','Σ(повт × подходы)'],['Ср.вес','Тоннаж ÷ КПШ'],['ОИ','Ср.вес ÷ ПМ × 100%'],['ПМ рост','ПМ_баз × (1 + 0.5%)^нед']].map(([t,d])=>`
      <div style="display:flex;gap:12px;margin-bottom:8px;align-items:flex-start">
        <div class="mono" style="font-size:.66rem;color:var(--portal);min-width:60px">${t}</div>
        <div style="font-size:.63rem;color:var(--t3);line-height:1.5">${d}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ── НАВИГАЦИЯ ──────────────────────────────────────
function navHTML(a){
  return`<nav id="nav">${[['home','🌀','База C-137'],['history','📼','Архив'],['progress','⚗️','Лаба']].map(([s,ic,l])=>
    `<button class="nb${a===s?' active':''}" onclick="navTo('${s}')">
      <span class="nb-icon">${ic}</span>
      <span class="nb-label">${l}</span>
    </button>`).join('')}</nav>`;
}

// ── РЕНДЕР ─────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(S.summary){app.innerHTML=summaryHTML();return;}
  if(S.screen==='workout'&&S.workout){app.innerHTML=workoutHTML();return;}
  if(S.screen==='setup'){app.innerHTML=setupHTML();return;}
  let c='';
  if(S.screen==='home')    c=homeHTML();
  if(S.screen==='history') c=historyHTML();
  if(S.screen==='progress')c=progressHTML();
  app.innerHTML=c+navHTML(S.screen);
}
render();
</script>
</body>
</html>
